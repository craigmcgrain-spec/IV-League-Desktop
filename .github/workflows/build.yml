name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pyinstaller PyQt6 reportlab cairosvg pillow

      - name: Convert SVG to ICO
        run: |
          python3 << 'EOF'
          import cairosvg
          from PIL import Image
          import io

          svg_path = "iv_league/assets/icon.svg"
          ico_path = "iv_league/assets/icon.ico"

          sizes = [16, 24, 32, 48, 64, 128, 256]
          images = []
          for size in sizes:
              png_data = cairosvg.svg2png(url=svg_path, output_width=size, output_height=size)
              img = Image.open(io.BytesIO(png_data)).convert('RGBA')
              images.append(img)

          base = images[-1]
          base.save(ico_path, format='ICO', sizes=[(s, s) for s in sizes], append_images=images[:-1])
          print(f"Created {ico_path}")
          EOF

      - name: Build AppImage
        run: |
          # Download appimagetool
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

          # Build with PyInstaller
          pyinstaller --onefile --windowed --name IVLeague \
            --add-data "iv_league/assets:iv_league/assets" \
            --add-data "iv_league/database:iv_league/database" \
            --clean main.py

          # Create AppDir
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp dist/IVLeague AppDir/usr/bin/iv-league
          chmod +x AppDir/usr/bin/iv-league
          ln -sf usr/bin/iv-league AppDir/AppRun

          cat > AppDir/iv-league.desktop << EOF
          [Desktop Entry]
          Name=IV League
          Comment=IV Therapy Tracking and Invoicing
          Exec=iv-league
          Icon=iv-league
          Terminal=false
          Type=Application
          Categories=Utility;
          EOF

          cp iv_league/assets/icon.svg AppDir/usr/share/icons/hicolor/256x256/apps/iv-league.svg
          cp iv_league/assets/icon.svg AppDir/iv-league.svg

          # Build AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage AppDir IVLeague-${{ github.ref_name }}-x86_64.AppImage

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: IVLeague-${{ github.ref_name }}-x86_64.AppImage

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyinstaller PyQt6 reportlab

      - name: Build executable
        run: |
          pyinstaller --onefile --windowed --name IVLeague ^
            --icon iv_league\assets\icon.ico ^
            --add-data "iv_league\assets;iv_league\assets" ^
            --add-data "iv_league\database;iv_league\database" ^
            --clean main.py

      - name: Build installer with Inno Setup
        uses: jurrianlammertsma/innosetup-action@v2
        with:
          script: installer/iv-league-setup.iss

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: installer/IVLeague-Setup-*.exe

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            linux-appimage/IVLeague-*.AppImage
            windows-installer/IVLeague-Setup-*.exe
          generate_release_notes: true
